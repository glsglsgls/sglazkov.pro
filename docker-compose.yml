version: "3.8"
services:
  front:
    image: nginx:1.24.0-alpine
    restart: unless-stopped
    ports:
      - 127.0.0.1:8001:80
    volumes:
      - ./front/src:/srv/www
      - /source/challenge_mount:/srv/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt
      - ./front/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - new
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
  back:
    image: python:3.11-slim
    restart: unless-stopped
    ports:
      - 127.0.0.1:8002:8080
    volumes:
      - ./back:/srv/www
    networks:
      new:
        aliases:
          - bck
    command: "/bin/sh -c 'cd /srv/www && pip install -r ./requirements.txt && gunicorn --bind 0.0.0.0:8080 --workers 2 main:app'"
networks:
  new: